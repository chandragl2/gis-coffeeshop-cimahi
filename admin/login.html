<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Admin - GIS Coffeeshop Cimahi</title>
    <link rel="stylesheet" href="assets/css/main.css" />
  </head>
  <body class="login-page">
    <!-- Login Container -->
    <div class="login-container">
      <div class="login-card">
        <!-- Header -->
        <div class="login-header">
          <h1 class="login-title">☕ GIS Coffeeshop</h1>
          <p class="login-subtitle">Admin Panel</p>
        </div>

        <!-- Login Form -->
        <form class="login-form" id="loginForm">
          <div class="form-group">
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Masukkan username"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Masukkan password"
              required
            />
          </div>

          <div class="form-group checkbox">
            <input type="checkbox" id="rememberMe" name="rememberMe" />
            <label for="rememberMe">Ingat saya</label>
          </div>

          <button type="submit" class="btn-login">Login</button>
        </form>

        <!-- Info Box -->
        <div class="login-info">
          <p><strong>Demo Credentials:</strong></p>
          <p>Username: <code>admin</code></p>
          <p>Password: <code>admin123</code></p>
        </div>

        <!-- Back Link -->
        <div class="login-footer">
          <a href="../public/index.html" class="back-link"
            >← Kembali ke Halaman User</a
          >
        </div>
      </div>

      <!-- Progress Badge -->
      <div class="progress-badge">
        <span>⚡ Progress: Tahap Awal</span>
      </div>
    </div>

    <!-- JavaScript -->
    <script src="assets/js/core/auth.js"></script>
  </body>
</html>
